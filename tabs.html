<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tabs Cleaner — All tabs</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px 40px;
      }
      header {
        position: sticky;
        top: 0;
        background: var(--bg);
        padding: 14px 0 12px;
        border-bottom: 1px solid var(--border);
        z-index: 10;
      }
      .header-row {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        flex-shrink: 0;
      }
      .filter-wrap {
        position: relative;
        flex: 1;
        max-width: 420px;
        margin-left: auto;
      }
      #filter {
        width: 100%;
        padding: 7px 10px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg);
        color: var(--fg);
        font-size: 13px;
        font-family: inherit;
      }
      #filter:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
        border-color: var(--accent);
      }
      kbd {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 10px;
        color: var(--muted);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 1px 5px;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        pointer-events: none;
      }
      #filter:focus + kbd,
      #filter:not(:placeholder-shown) + kbd {
        display: none;
      }
      .summary-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      .summary {
        display: flex;
        gap: 18px;
        color: var(--muted);
        font-size: 12px;
      }
      .summary strong {
        color: var(--fg);
        font-weight: 600;
        margin-right: 4px;
      }
      .summary .filter-hint {
        color: var(--accent);
        font-weight: 600;
      }
      .dup-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 10px;
        padding: 8px 12px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 4px;
        font-size: 12px;
        flex-wrap: wrap;
      }
      .dup-bar[hidden] {
        display: none;
      }
      .dup-count {
        color: var(--fg);
      }
      main {
        padding: 16px 0;
      }
      .domain-group {
        margin-bottom: 14px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 6px;
        overflow: hidden;
      }
      .domain-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        background: var(--bg);
      }
      .domain-group.collapsed .domain-header {
        border-bottom: none;
      }
      .domain-group.collapsed .url-list {
        display: none;
      }
      .toggle-btn {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        background: transparent;
        border: none;
        color: inherit;
        font: inherit;
        padding: 0;
        text-align: left;
        cursor: pointer;
      }
      .toggle-btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 2px;
      }
      .toggle-btn:hover .domain-name,
      .toggle-btn:focus-visible .domain-name {
        color: var(--accent);
      }
      .chevron {
        flex-shrink: 0;
        color: var(--muted);
        width: 12px;
        text-align: center;
        font-size: 12px;
      }
      .domain-name {
        font-size: 14px;
        font-weight: 600;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .domain-total {
        color: var(--muted);
        font-size: 12px;
        flex-shrink: 0;
      }
      .url-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 14px;
        border-top: 1px solid var(--border);
      }
      .url-row:first-child {
        border-top: none;
      }
      .url-row.has-duplicates {
        background: var(--accent-tint);
      }
      .count {
        min-width: 30px;
      }
      .url-idle {
        flex-shrink: 0;
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .empty {
        color: var(--muted);
        font-style: italic;
        padding: 30px 0;
        text-align: center;
      }
      .empty-action {
        display: block;
        margin: 10px auto 0;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-row">
        <h1>Tabs Cleaner</h1>
        <div class="filter-wrap">
          <input
            id="filter"
            type="search"
            placeholder="Filter URLs or titles…"
            autocomplete="off"
          />
          <kbd>/</kbd>
        </div>
      </div>
      <div class="summary-row">
        <div class="summary" id="summary"></div>
        <button type="button" class="action-btn" id="collapse-all">Collapse all</button>
      </div>
      <div class="dup-bar" id="dup-bar" hidden>
        <span class="dup-count" id="dup-count"></span>
        <button type="button" class="action-btn danger" id="cleanup">Clean up duplicates</button>
      </div>
    </header>
    <main id="main"></main>
    <script type="module" src="tabs.js"></script>
  </body>
</html>

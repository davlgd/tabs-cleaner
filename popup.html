<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tabs Cleaner</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      body {
        margin: 0;
        padding: 12px;
        width: 440px;
      }
      section + section {
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px solid var(--border);
      }
      h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        margin: 0 0 10px;
        font-weight: 600;
      }
      h3 {
        font-size: 12px;
        margin: 12px 0 6px;
        font-weight: 600;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }
      .stat {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 4px;
        text-align: center;
      }
      .stat.clickable {
        cursor: pointer;
      }
      .stat.clickable:hover,
      .stat.clickable:focus-visible {
        border-color: var(--accent);
        outline: none;
      }
      .stat.clickable:hover .value,
      .stat.clickable:focus-visible .value {
        text-decoration: underline;
        text-decoration-color: var(--accent);
        text-underline-offset: 3px;
      }
      .stat .value {
        font-size: 18px;
        font-weight: 600;
        color: var(--accent);
      }
      .stat .label {
        font-size: 10px;
        color: var(--muted);
        text-transform: uppercase;
        margin-top: 2px;
      }
      .idle-summary {
        color: var(--muted);
        font-size: 12px;
        margin: 0 0 8px;
      }
      .idle-summary strong {
        color: var(--fg);
        font-weight: 600;
      }
      li {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 4px;
        border-top: 1px solid var(--border);
        border-radius: 3px;
      }
      li:first-child {
        border-top: none;
      }
      .duration {
        flex-shrink: 0;
        min-width: 52px;
        font-variant-numeric: tabular-nums;
        color: var(--accent);
        font-weight: 600;
      }
      .count {
        min-width: 28px;
      }
      .title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
        min-width: 0;
      }
      .open-full-btn {
        display: block;
        width: 100%;
        margin-top: 16px;
        padding: 8px 10px;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--fg);
        font-size: 12px;
        font-family: inherit;
        cursor: pointer;
      }
      .open-full-btn:hover,
      .open-full-btn:focus-visible {
        border-color: var(--accent);
        color: var(--accent);
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
